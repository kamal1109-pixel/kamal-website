<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadowfax Learning & Development</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
	--ink:#14202B;
	--paper:#F3F5F7;
	--card:#FFFFFF;
	--line:#D5DCE3;
	--route:#1F5FD6;
	--dispatch:#F2662D;
	--muted:#5B6B7A;
	--side:272px;
}

* { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; }

body {
	font-family:'Archivo',Arial,sans-serif;
	background:var(--paper);
	color:var(--ink);
	line-height:1.5;
}

a { color:inherit; }

:focus-visible { outline:3px solid var(--route); outline-offset:2px; }

.app { display:grid; grid-template-columns:var(--side) 1fr; min-height:100%; }

.side {
	background:var(--ink);
	color:#E8EEF3;
	padding:22px 14px;
	position:sticky;
	top:0;
	height:100vh;
	overflow-y:auto;
}

.brand {
	display:block;
	text-decoration:none;
	padding:4px 10px 20px;
	border-bottom:1px solid #2B3A48;
	margin-bottom:14px;
}
.brand b { display:block; font-size:22px; font-weight:800; }
.brand span { font-size:13px; color:#9FB0BF; }
.brand i {
	display:inline-block;
	width:28px;
	height:4px;
	background:var(--dispatch);
	margin-bottom:8px;
	border-radius:2px;
}

.group { margin:16px 0 4px; padding:0 10px; font-size:13px; color:#8DA0B1; font-weight:600; }

.nav a {
	display:block;
	text-decoration:none;
	padding:9px 10px;
	border-radius:6px;
	font-size:15px;
	color:#DCE5EC;
	border-left:3px solid transparent;
}
.nav a:hover { background:#1F2F3D; }
.nav a.on {
	background:#1F2F3D;
	border-left-color:var(--dispatch);
	color:#fff;
	font-weight:600;
}

.credit {
	margin:24px 10px 8px;
	padding-top:14px;
	border-top:1px solid #2B3A48;
	color:#9FB0BF;
	font-size:13px;
}
.credit b { color:#E8EEF3; }

.main { min-width:0; display:flex; flex-direction:column; }

.top {
	display:none;
	align-items:center;
	gap:12px;
	background:var(--ink);
	color:#fff;
	padding:12px 16px;
	position:sticky;
	top:0;
	z-index:20;
}
.top button {
	background:none;
	border:1px solid #3A4B5A;
	color:#fff;
	border-radius:6px;
	padding:6px 12px;
	font:inherit;
	cursor:pointer;
}

.page { padding:36px clamp(18px,4vw,48px) 48px; flex:1; }

.hero h1 {
	font-size:clamp(30px,4.4vw,48px);
	font-weight:800;
	line-height:1.08;
	max-width:18ch;
}
.hero p { margin-top:12px; color:var(--muted); max-width:56ch; font-size:17px; }

.sec-title { margin:36px 0 14px; font-size:18px; font-weight:700; }

.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; }

.tile {
	display:flex;
	flex-direction:column;
	gap:6px;
	background:var(--card);
	border:1px solid var(--line);
	border-radius:8px;
	padding:16px 18px;
	text-decoration:none;
	min-height:112px;
}
.tile:hover { border-color:var(--route); }
.tile h3 { font-size:17px; }
.tile p { font-size:14px; color:var(--muted); }

.dbar {
	display:flex;
	flex-wrap:wrap;
	align-items:flex-end;
	justify-content:space-between;
	gap:12px;
	margin-bottom:16px;
}
.dbar h2 { font-size:clamp(24px,3vw,34px); font-weight:800; }
.dbar p { color:var(--muted); font-size:15px; margin-top:2px; }

.open {
	display:inline-block;
	text-decoration:none;
	background:var(--route);
	color:#fff;
	padding:9px 16px;
	border-radius:6px;
	font-weight:600;
}
.open:hover { background:#174CB0; }
.open.big { margin-top:8px; padding:14px 28px; font-size:18px; border-radius:8px; }

.foot {
	padding:18px clamp(18px,4vw,48px) 28px;
	font-size:14px;
	color:var(--muted);
	border-top:1px solid var(--line);
}
.foot b { color:var(--ink); }

@media(max-width:860px) {
	.app { grid-template-columns:1fr; }
	.top { display:flex; }

	.side {
		position:fixed;
		left:0;
		top:0;
		bottom:0;
		width:min(86vw,300px);
		z-index:30;
		transform:translateX(-100%);
		transition:transform .2s;
	}

	body.menu .side { transform:none; }

	body.menu::after {
		content:"";
		position:fixed;
		inset:0;
		background:rgba(0,0,0,.45);
		z-index:25;
	}
}

@media(prefers-reduced-motion:reduce) {
	* { transition:none!important; }
}
</style>
</head>

<body>

<div class="app">

	<aside class="side" id="side">

		<a class="brand" href="#home">
			<i></i>
			<b>Shadowfax</b>
			<span>Learning &amp; Development</span>
		</a>

		<nav class="nav" id="nav" aria-label="Dashboards"></nav>

		<div class="credit">
			Made by <b>Kamal</b>
		</div>

	</aside>

	<div class="main">

		<div class="top">
			<button id="menuBtn">Menu</button>
			<b>Shadowfax L&amp;D</b>
		</div>

		<main class="page" id="view"></main>

		<footer class="foot">Made by <b>Kamal</b></footer>

	</div>
</div>

<script>

/* DASHBOARD LINKS */

const GROUPS = [

{
name:"Training",
items:[
{
id:"ramp-up",
title:"Ramp up",
desc:"New joiner ramp up progress",
url:"https://docs.google.com/spreadsheets/d/1-sHanba2frMZTR3qNdLiDE76UEmAg6hmCTuGGEZPaK0/edit?gid=1774207249#gid=1774207249"
},
{
id:"ptl-training",
title:"PTL training",
desc:"PTL training coverage and completion",
url:"https://docs.google.com/spreadsheets/d/1-sHanba2frMZTR3qNdLiDE76UEmAg6hmCTuGGEZPaK0/edit?gid=1774207249#gid=1774207249"
},
{
id:"ddd",
title:"DDD",
desc:"DDD training dashboard",
url:"https://docs.google.com/spreadsheets/d/10WJkJzQXH6iVfsonxpLwv5FWfemzeaiOqMZkqOkE_Go/edit?gid=957992789#gid=957992789"
},
{
id:"defaulter-training",
title:"Defaulter training",
desc:"Defaulter training status",
url:"https://docs.google.com/spreadsheets/d/178NDFN1mNYwM0Pde8a5VWZ-dJJjXR-41oD-7Fbn4kd4/edit?gid=788298256#gid=788298256"
},
{
id:"refresher-training",
title:"Refresher training",
desc:"Refresher training completion",
url:"https://docs.google.com/spreadsheets/d/1eS0mTwjSlpy6KkltgCWGsae9Kc78fbSUbJ3X1wq-Izw/edit?gid=646238560#gid=646238560"
}
]
},

{
name:"Scan rate",
items:[
{
id:"primary-scan-rate",
title:"Primary scan rate",
desc:"Primary scan rate by hub",
url:"https://docs.google.com/spreadsheets/d/1-sHanba2frMZTR3qNdLiDE76UEmAg6hmCTuGGEZPaK0/edit?gid=1774207249#gid=1774207249"
},
{
id:"manifest-scan-rate",
title:"Manifest scan rate",
desc:"Manifest scan rate by hub",
url:"https://docs.google.com/spreadsheets/d/1Cn9o-x9rZfA0j5S4nl_mXmQrgFlgBKQ-RTCAvsOwdP0/edit?gid=2146713997#gid=2146713997"
}
]
},

{
name:"Audits and checks",
items:[
{
id:"checklist",
title:"Checklist",
desc:"Checklist compliance",
url:"https://docs.google.com/spreadsheets/d/1t44JVdQEBuxxHxjk101pwQ57GK4d41rg2zFs-liEq78/edit?gid=1082981080#gid=1082981080"
},
{
id:"stress-test",
title:"Stress test",
desc:"Stress test results",
url:"https://docs.google.com/spreadsheets/d/1w8i13uqTttYa7nAlB4fXU_d0ilgCGmiUhi2jHEw30ps/edit?gid=0#gid=0"
},
{
id:"bag-audit",
title:"Bag audit",
desc:"Bag audit findings",
url:"https://docs.google.com/spreadsheets/d/1XXxNkT8LPDoj8JbCR7X6GvfJ-d4RhfqLQSzSExO6Hhw/edit?gid=1661938646#gid=1661938646"
},
{
id:"process-audit",
title:"Process audit",
desc:"Process audit scores",
url:""
},
{
id:"sc-process-audit",
title:"SC process audit",
desc:"Service centre process audit scores",
url:""
}
]
},

{
name:"Tracking",
items:[
{
id:"ld-tracker",
title:"L&D tracker",
desc:"L&D tracker",
url:"https://docs.google.com/spreadsheets/d/1v8SFh6FxkKpzEi9RdXNKwktxhxVooj8sT9F-CR_DV-A/edit?gid=0#gid=0"
},
{
id:"north-zone",
title:"North Zone",
desc:"SC Process Audit Summary-North Zone",
url:"https://docs.google.com/spreadsheets/d/11IlSx4ZFYx2bfP4R8__fU1z_9oeLTykCdvnsyyITbrE/edit?gid=0#gid=0"
}
]
}

];

/* MAIN CODE */

const ALL = GROUPS.flatMap(g => g.items);

const nav = document.getElementById('nav');
const view = document.getElementById('view');

const esc = s => String(s).replace(/[&<>\"]/g, c => ({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;'
}[c]));

const safeUrl = u =>
typeof u === "string" && /^https?:\/\//i.test(u.trim())
? u.trim()
: "";

/* SIDEBAR */

nav.innerHTML =
`<a href="#home" data-id="home">Home</a>` +
GROUPS.map(g =>
`<div class="group">${esc(g.name)}</div>` +
g.items.map(i =>
`<a href="#${i.id}" data-id="${i.id}">${esc(i.title)}</a>`
).join('')
).join('');

/* HOME PAGE */

function home() {

view.innerHTML = `
<section class="hero">
<h1>Shadowfax Learning &amp; Development</h1>
<p>Training, scan rate and audit dashboards in one place.</p>
</section>
` +
GROUPS.map(g => `
<h2 class="sec-title">${esc(g.name)}</h2>
<div class="grid">
${g.items.map(i => `
<a class="tile" href="#${i.id}">
<h3>${esc(i.title)}</h3>
<p>${esc(i.desc)}</p>
</a>
`).join('')}
</div>
`).join('');

}

/* DASHBOARD PAGE */

function dash(item) {

const url = safeUrl(item.url);

view.innerHTML = `
<div class="dbar">
<div>
<h2>${esc(item.title)}</h2>
<p>${esc(item.desc)}</p>
</div>
</div>

${url
? `<a class="open big" href="${esc(url)}" target="_blank" rel="noopener">Click to view</a>`
: ``
}
`;

}

/* PAGE ROUTING */

function route() {

const id = (location.hash || '#home').slice(1);

const item = ALL.find(i => i.id === id);

if(item) {
dash(item);
} else {
home();
}

nav.querySelectorAll('a').forEach(a => {
a.classList.toggle(
'on',
a.dataset.id === (item ? id : 'home')
);
});

document.title =
(item ? item.title + ' | ' : '') +
'Shadowfax Learning & Development';

document.body.classList.remove('menu');

window.scrollTo(0,0);

}

window.addEventListener('hashchange', route);

document.getElementById('menuBtn').addEventListener('click', () => {
document.body.classList.toggle('menu');
});

document.body.addEventListener('click', e => {

if (
document.body.classList.contains('menu') &&
!e.target.closest('#side') &&
!e.target.closest('#menuBtn')
) {
document.body.classList.remove('menu');
}

});

route();

</script>

</body>
</html>
